<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" role="img" aria-labelledby="title desc">
  <title id="title">Boomerang Flow v5 webhooks and events</title>
  <desc id="desc">Inbound, on the left: a sender with a Flow token posts to /api/v2/webhook, /api/v2/event or /api/v2/callback on core, which starts or resumes a workflow run. GitHub posts signed deliveries to /api/v2/webhook, which can start runs. Slack posts signed requests to /api/v2/integration/slack/*, which core's Slack integration handles. Outbound, on the right: each run status change writes a row to the outbox in MongoDB; the outbox drain on every core instance reads it every 5 seconds and posts CloudEvents to the configured sinks, which are off by default.</desc>
  <defs>
    <style>
      text { font-family: "IBM Plex Sans", system-ui, sans-serif; font-size: 13px; fill: #1f2328; }
      .t { font-size: 14px; font-weight: 600; }
      .h { font-size: 15px; font-weight: 600; }
      .m { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .s { fill: #57606a; }
      .c { text-anchor: middle; }
      .e { text-anchor: end; }
      .halo { paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .flow { fill: #f4effc; stroke: #6e32c9; stroke-width: 1.5; }
      .inner { fill: #ffffff; stroke: #6e32c9; stroke-width: 1; }
      .ext { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1; }
      .line { fill: none; stroke: #57606a; stroke-width: 1.5; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,1 L10,5 L0,9 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect class="panel" x="0.5" y="0.5" width="959" height="479" rx="12"/>

  <!-- Column headings -->
  <text class="s" x="24" y="34">Inbound</text>
  <text class="s e" x="940" y="34">Outbound</text>

  <!-- Senders -->
  <rect class="ext" x="24" y="72" width="124" height="124" rx="6"/>
  <text class="t c" x="86" y="124">Sender</text>
  <text class="c" x="86" y="144">any system</text>
  <text class="c" x="86" y="162">with a token</text>

  <rect class="ext" x="24" y="220" width="124" height="48" rx="6"/>
  <text class="t c" x="86" y="249">GitHub</text>

  <rect class="ext" x="24" y="292" width="124" height="48" rx="6"/>
  <text class="t c" x="86" y="321">Slack</text>

  <!-- Core -->
  <rect class="flow" x="388" y="40" width="340" height="324" rx="6"/>
  <text x="404" y="66"><tspan class="h">Core</tspan><tspan class="m" dx="10">flow-service-core</tspan></text>

  <rect class="inner" x="408" y="84" width="140" height="180" rx="6"/>
  <text class="t c" x="478" y="168">Workflow run</text>
  <text class="c" x="478" y="188">starts or resumes</text>

  <rect class="inner" x="408" y="290" width="140" height="52" rx="6"/>
  <text class="t c" x="478" y="321">Slack integration</text>

  <rect class="inner" x="576" y="150" width="136" height="114" rx="6"/>
  <text class="t c" x="644" y="196">Outbox drain</text>
  <text class="c" x="644" y="216">on every core</text>
  <text class="c" x="644" y="234">instance</text>

  <!-- MongoDB outbox -->
  <rect class="ext" x="540" y="412" width="188" height="48" rx="6"/>
  <text class="t c" x="634" y="432">MongoDB</text>
  <text class="c" x="634" y="451">outbox</text>

  <!-- Sinks -->
  <rect class="ext" x="824" y="160" width="116" height="96" rx="6"/>
  <text class="t c" x="882" y="190">Sinks</text>
  <text class="c" x="882" y="211">configured URLs</text>
  <text class="s c" x="882" y="230">off by default</text>

  <!-- Inbound arrows -->
  <line class="line" x1="148" y1="96" x2="408" y2="96" marker-end="url(#arrowhead)"/>
  <text class="m c halo" x="268" y="89">/api/v2/webhook</text>
  <line class="line" x1="148" y1="134" x2="408" y2="134" marker-end="url(#arrowhead)"/>
  <text class="m c halo" x="268" y="127">/api/v2/event</text>
  <line class="line" x1="148" y1="172" x2="408" y2="172" marker-end="url(#arrowhead)"/>
  <text class="m c halo" x="268" y="165">/api/v2/callback</text>

  <line class="line" x1="148" y1="244" x2="408" y2="244" marker-end="url(#arrowhead)"/>
  <text class="m c halo" x="268" y="237">/api/v2/webhook</text>
  <text class="s c halo" x="268" y="262">signed delivery</text>

  <line class="line" x1="148" y1="316" x2="408" y2="316" marker-end="url(#arrowhead)"/>
  <text class="m c halo" x="268" y="309">/api/v2/integration/slack/*</text>
  <text class="s c halo" x="268" y="334">signed request</text>

  <!-- Outbound arrows -->
  <path class="line" d="M548,236 H562 V412" marker-end="url(#arrowhead)"/>
  <text class="e halo" x="554" y="392">each status change writes a row</text>

  <line class="line" x1="644" y1="412" x2="644" y2="264" marker-end="url(#arrowhead)"/>
  <text class="halo" x="652" y="392">every 5 s</text>

  <line class="line" x1="712" y1="207" x2="824" y2="207" marker-end="url(#arrowhead)"/>
  <text class="c halo" x="774" y="199">CloudEvents</text>

  <!-- Legend -->
  <rect class="flow" x="24" y="412" width="14" height="14" rx="3"/>
  <text x="46" y="424">Flow component</text>
  <rect class="ext" x="24" y="436" width="14" height="14" rx="3"/>
  <text x="46" y="448">Other system</text>
</svg>
